- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install base packages
  apt:
    name:
      - acl
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - vim
      - git
      - fail2ban
    state: present

- name: Ensure fail2ban is enabled and started
  ansible.builtin.service:
    name: fail2ban
    enabled: yes
    state: started

- name: Create homelab group
  ansible.builtin.group:
    name: "{{ service_group }}"

- name: Create service user
  ansible.builtin.user:
    name: "{{ service_user }}"
    group: "{{ service_group }}"
    shell: /bin/bash
    create_home: yes

- name: Ensure homelab directory exists
  ansible.builtin.file:
    path: /opt/homelab
    state: directory
    owner: "{{ service_user }}"
    group: "{{ service_group }}"
    mode: '0755'
  become: true

- name: Ensure homelab cache directory exists
  ansible.builtin.file:
    path: "{{ cache_path }}"
    state: directory
    owner: "{{ service_user }}"
    group: "{{ service_group }}"
    mode: '0755'
  become: true

- name: "Get service user info"
  ansible.builtin.getent:
    database: passwd
    key: "{{ service_user }}"

- name: "Set uid and gid facts"
  ansible.builtin.set_fact:
    service_uid: "{{ ansible_facts.getent_passwd[service_user][1] }}"
    service_gid: "{{ ansible_facts.getent_passwd[service_user][2] }}"

- name: "Add SSH keys for {{ ansible_user }} user"
  import_tasks: add_keys.yml
