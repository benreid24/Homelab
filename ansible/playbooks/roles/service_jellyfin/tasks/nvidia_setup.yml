---
- name: Install prerequisites for NVIDIA Container Toolkit
  ansible.builtin.apt:
    name:
      - curl
      - gnupg2
    state: present
    update_cache: yes
    install_recommends: no
  become: yes

- name: Create keyrings directory if it doesn't exist
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    mode: "0755"
  become: yes

- name: Download NVIDIA Container Toolkit GPG key
  ansible.builtin.get_url:
    url: https://nvidia.github.io/libnvidia-container/gpgkey
    dest: /tmp/nvidia-container-toolkit.gpg
    mode: "0644"
  become: yes

- name: Dearmor and install NVIDIA GPG key
  ansible.builtin.shell: |
    gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg /tmp/nvidia-container-toolkit.gpg
  args:
    creates: /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
  become: yes

- name: Add NVIDIA Container Toolkit repository
  ansible.builtin.shell: |
    curl -s -L https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list | \
    sed 's#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#g' | \
    tee /etc/apt/sources.list.d/nvidia-container-toolkit.list
  args:
    creates: /etc/apt/sources.list.d/nvidia-container-toolkit.list
  become: yes

- name: Update apt cache after adding NVIDIA repository
  ansible.builtin.apt:
    update_cache: yes
  become: yes

- name: Install NVIDIA Container Toolkit packages
  ansible.builtin.apt:
    name:
      - nvidia-container-toolkit=1.18.1-1
      - nvidia-container-toolkit-base=1.18.1-1
      - libnvidia-container-tools=1.18.1-1
      - libnvidia-container1=1.18.1-1
    state: present
    allow_downgrade: yes
  become: yes
