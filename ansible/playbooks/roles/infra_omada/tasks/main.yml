- name: Setup Omada service
  include_tasks: ../../shared_tasks/tasks/init_service.yml
  vars:
    service_name: Omada
    reverse_proxy: reverse_proxy.conf.j2
    skip_chown_data: true
    config_copies:
      - src_config_path: .
    env_content: |
      DATA_PATH={{ services_data_path }}/Omada
      TIMEZONE={{ timezone }}
