services:
  leantime_db:
    image: mysql:8.4
    container_name: leantime-db
    volumes:
      - ${DATA_VOLUME}/mysql:/var/lib/mysql
    restart: unless-stopped
    env_file: ./.env
    networks:
      - leantime-net
    command: --character-set-server=UTF8MB4 --collation-server=UTF8MB4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  leantime:
    image: leantime/leantime:${LEAN_VERSION:-latest}
    container_name: leantime
    restart: unless-stopped
    env_file: ./.env
    security_opt:
      - no-new-privileges:true
    cap_add:
      # - CAP_NET_BIND_SERVICE
      - CAP_CHOWN
      - CAP_SETGID
      - CAP_SETUID
    networks:
      - leantime-net
      - homelab
    volumes:
      - ${DATA_VOLUME}/public_userfiles:/var/www/html/public/userfiles
      - ${DATA_VOLUME}/userfiles:/var/www/html/userfiles
      - ${DATA_VOLUME}/plugins:/var/www/html/app/Plugins
      - leantime-logs:/var/www/html/storage
    depends_on:
      leantime_db:
        condition: service_healthy

volumes:
  leantime-logs:

networks:
  leantime-net:
  homelab:
    external: true
