- name: Ensure Leantime storage directory exists
  ansible.builtin.file:
    path: "{{ services_data_path }}/Leantime/storage"
    state: directory
    owner: "{{ service_user }}"
    group: "{{ service_group }}"
    mode: "0755"
  become: true

- name: Setup Leantime service
  include_tasks: ../../shared_tasks/tasks/init_service.yml
  vars:
    service_name: Leantime
    reverse_proxy: reverse_proxy.conf.j2
    skip_chown_data: true
    config_copies:
      - src_config_path: .
    env_content: |
      PUID={{ service_uid }}
      PGID={{ service_gid }}
      DATA_VOLUME={{ services_data_path }}/Leantime

      MYSQL_ROOT_PASSWORD={{ leantime_db_root_password }}
      MYSQL_DATABASE={{ leantime.db_name }}
      MYSQL_USER={{ leantime.db_user }}
      MYSQL_PASSWORD={{ leantime_db_password }}

      LEAN_DB_HOST=leantime-db
      LEAN_DB_USER={{ leantime.db_user }}
      LEAN_DB_PASSWORD={{ leantime_db_password }}
      LEAN_DB_DATABASE={{ leantime.db_name }}
      LEAN_DB_PORT=3306

      LEAN_SITENAME=BenAnna Projects
      LEAN_SESSION_PASSWORD={{ leantime_session_password }}

- name: Ensure Leantime data subdirectories exist with correct ownership
  ansible.builtin.file:
    path: "{{ services_data_path }}/Leantime/{{ item }}"
    state: directory
    owner: "{{ service_user }}"
    group: "{{ service_group }}"
    mode: "0755"
  loop:
    - public_userfiles
    - userfiles
    - plugins
    - storage
  become: true
