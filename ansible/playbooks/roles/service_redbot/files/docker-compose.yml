services:
  red-bot:
    build:
      context: .
      args:
        PUID: ${PUID}
        PGID: ${PGID}
    container_name: redbot
    restart: unless-stopped
    environment:
      INSTANCE_NAME: "BenAnnaBot"
      PREFIX: "!"
      TOKEN: "${TOKEN}"
    volumes:
      - ${DATA_PATH}:/redbot/data
