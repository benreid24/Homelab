- name: Get latest youtube-source plugin release
  ansible.builtin.uri:
    url: https://api.github.com/repos/lavalink-devs/youtube-source/releases/latest
    return_content: true
  register: _redbot_youtube_plugin_release
  when: redbot_lavalink_youtube_plugin_version == "latest"

- name: Pin youtube-source plugin version to latest release
  ansible.builtin.set_fact:
    redbot_lavalink_youtube_plugin_version: "{{ _redbot_youtube_plugin_release.json.tag_name }}"
  when: redbot_lavalink_youtube_plugin_version == "latest"

- name: Setup Redbot service
  include_tasks: ../../shared_tasks/tasks/init_service.yml
  vars:
    service_name: Redbot
    env_content: |
      TOKEN={{ redbot_discord_token }}
      DATA_PATH={{ services_data_path }}/Redbot
      YT_CIPHER_TOKEN={{ redbot_lavalink_cipher_token }}
    config_copies:
      - src_config_path: .
    templates:
      - src_template_path: application.yml.j2
        dst_template_path: lavalink/application.yml

- name: Create Redbot Lavalink data directories
  ansible.builtin.file:
    path: "{{ services_data_path }}/Redbot/lavalink/{{ item }}"
    state: directory
    mode: "0755"
    owner: "{{ service_user }}"
    group: "{{ service_group }}"
  loop:
    - plugins
    - logs
  become: true

- name: Check if Redbot core settings already exist
  ansible.builtin.stat:
    path: "{{ services_data_path }}/Redbot/core/settings.json"
  register: redbot_data_check

- name: Copy Redbot seed data
  ansible.builtin.synchronize:
    src: "{{ services_config_path }}/Redbot/data/"
    dest: "{{ services_data_path }}/Redbot"
    recursive: yes
    rsync_opts:
      - "--chmod=Du=rwx,Dg=rx,Do=rx,Fu=rw,Fg=r,Fo=r"
  delegate_to: "{{ inventory_hostname }}"
  when: not redbot_data_check.stat.exists
  register: redbot_seed

- name: Restart Redbot if seed data was copied
  ansible.builtin.shell:
    chdir: "{{ services_config_path }}/Redbot"
    cmd: docker compose up -d --force-recreate --build
  when: redbot_seed.changed
  become: true
