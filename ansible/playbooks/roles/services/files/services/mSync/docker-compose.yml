services:
  msync:
    build:
      context: ./mSync
      dockerfile: Dockerfile
    container_name: msync
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - NODE_ENV=production
      - PORT=3000
      - DATA_PATH=/app/data
      - MUSIC_PATH=/app/music
      - TMP_PATH=/tmp
    volumes:
      - ${DATA_PATH}/mSync:/app/data
      - ${MUSIC_PATH}/Music:/app/music
    restart: unless-stopped
    networks:
      - homelab

  msync-seadrive:
    build:
      context: ./seafile
      dockerfile: Dockerfile
    container_name: msync-seadrive
    restart: unless-stopped
    devices:
      - /dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - SEAFILE_SERVER_URL=${SEAFILE_SERVER}
      - SEAFILE_USERNAME=${SEAFILE_USERNAME}
      - SEAFILE_TOKEN=${SEAFILE_TOKEN}
      - SEAFILE_LIBRARY_ID=${SEAFILE_LIBRARY_ID}
      - SEAFILE_DATA_DIR=/data
      - SEAFILE_CONFIG_DIR=/config
    volumes:
      - ${DATA_PATH}/seafile:/config
      - ${MUSIC_PATH}:/data

  msync-syncthing:
    image: syncthing/syncthing
    container_name: msync-syncthing
    hostname: syncthing-music.${HOSTNAME}
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - STGUIADDRESS=0.0.0.0:8384
    volumes:
      - ${MUSIC_PATH}/Music:/var/syncthing/Music
      - ${DATA_PATH}/mSync/syncthing:/var/syncthing/config
    ports:
      - "22000:22000/tcp"
      - "22000:22000/udp"
      - "21027:21027/udp"
    restart: unless-stopped
    healthcheck:
      test: curl -fkLsS -m 2 127.0.0.1:8384/rest/noauth/health | grep -o --color=never OK || exit 1
      interval: 1m
      timeout: 10s
      retries: 3
    networks:
      - homelab

networks:
  homelab:
    external: true
