- name: Write Homepage .env file
  copy:
    dest: "{{ services_config_path }}/Homepage/.env"
    owner: "{{ service_user }}"
    group: "{{ service_group }}"
    mode: '0600'
    content: |
      DATA_PATH={{ services_config_path }}/Homepage/config
      HOSTNAME={{ external_hostname }}
  become: true
  register: homepage_env_config

- name: Template Homepage services.yaml
  template:
    src: "Homepage/config/services.yaml.j2"
    dest: "{{ services_config_path }}/Homepage/config/config/services.yaml"
    owner: "{{ service_user }}"
    group: "{{ service_group }}"
    mode: '0600'
  become: true

- name: Mark Homepage for restart
  set_fact:
    services_to_restart: "{{ services_to_restart | default([]) | union(['Homepage']) }}"
  when: homepage_env_config.changed
