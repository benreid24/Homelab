- name: Write Homepage .env file
  copy:
    dest: "{{ services_config_path }}/Homepage/.env"
    owner: "{{ service_user }}"
    group: "{{ service_group }}"
    mode: '0600'
    content: |
      CONFIG_PATH={{ services_data_path }}/Homepage/config
      HOSTNAME={{ external_hostname }}
  become: true
  register: homepage_env_config

- name: Ensure Homepage config directory exists
  ansible.builtin.file:
    path: "{{ services_data_path }}/Homepage/config"
    state: directory
    owner: "{{ service_user }}"
    group: "{{ service_group }}"
    mode: '0755'
  become: true

- name: Mark Homepage for restart
  set_fact:
    services_to_restart: "{{ services_to_restart | default([]) | union(['Homepage']) }}"
  when: homepage_env_config.changed
