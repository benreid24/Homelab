- name: Gather facts from all homelab hosts
  hosts: homelab
  gather_facts: true
  tasks: []

- name: Provision Offsite Pi
  hosts: offsite_pi
  become: true

  roles:
    - common
    - docker
    - docker_proxy
    - smb_host
    - infra_nginx
    - infra_komodo
    - service_seafile_client
    - service_homepage
    - infra_cadvisor
    - infra_node_exporter
    - infra_gatus

